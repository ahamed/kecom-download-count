<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirki eCommerce — Downloads</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white antialiased">
    <div class="pointer-events-none fixed inset-0 overflow-hidden" aria-hidden="true">
        <div class="absolute -left-1/4 top-0 h-[500px] w-[500px] rounded-full bg-violet-600/10 blur-3xl"></div>
        <div class="absolute -right-1/4 bottom-0 h-[500px] w-[500px] rounded-full bg-blue-600/10 blur-3xl"></div>
    </div>

    <main class="relative flex min-h-screen items-center justify-center px-4 py-16">
        <div class="w-full max-w-3xl">
            <header class="mb-10 text-center">
                <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">Kirki eCommerce</h1>
                <p class="mt-2 text-slate-400">Download Statistics</p>
            </header>

            <div id="error-banner" class="mb-6 hidden rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-center text-sm text-red-300" role="alert">
                Unable to fetch download data. Retrying automatically…
            </div>

            <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
                <article id="total-card" class="rounded-2xl border border-slate-800 bg-slate-900/80 p-8 shadow-xl backdrop-blur transition-colors duration-300">
                    <p class="text-sm uppercase tracking-wider text-slate-400">Total Downloads</p>
                    <p id="total-count" class="mt-3 text-5xl font-bold tabular-nums tracking-tight text-white" aria-live="polite">—</p>
                    <p class="mt-2 text-sm text-slate-500">All releases</p>
                </article>

                <article id="latest-card" class="rounded-2xl border border-slate-800 bg-slate-900/80 p-8 shadow-xl backdrop-blur transition-colors duration-300">
                    <p class="text-sm uppercase tracking-wider text-slate-400">Latest Release</p>
                    <p id="latest-count" class="mt-3 text-5xl font-bold tabular-nums tracking-tight text-white" aria-live="polite">—</p>
                    <div id="latest-meta" class="mt-4 space-y-2">
                        <span id="latest-tag" class="inline-block rounded-full bg-violet-500/20 px-3 py-1 font-mono text-sm text-violet-300">—</span>
                        <p id="latest-name" class="text-sm text-slate-300">—</p>
                        <p id="latest-date" class="text-sm text-slate-500">—</p>
                    </div>
                </article>
            </div>

            <article id="distribution-card" class="mt-6 rounded-2xl border border-slate-800 bg-slate-900/80 p-6 shadow-xl backdrop-blur sm:p-8">
                <p class="mb-6 text-sm uppercase tracking-wider text-slate-400">Download Distribution by Channel</p>
                <div class="flex flex-col items-center gap-8 sm:flex-row">
                    <div class="relative h-56 w-56 shrink-0">
                        <canvas id="distribution-chart"></canvas>
                    </div>
                    <ul id="distribution-legend" class="w-full space-y-3">
                        <li class="text-sm text-slate-500">Loading…</li>
                    </ul>
                </div>
            </article>

            <footer class="mt-10 flex items-center justify-center gap-2 text-sm text-slate-500">
                <span class="relative flex h-2.5 w-2.5" aria-hidden="true">
                    <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex h-2.5 w-2.5 rounded-full bg-emerald-500"></span>
                </span>
                <span>Live · <span id="last-updated">Connecting…</span></span>
            </footer>

            <div class="mt-6 text-center">
                <button id="history-toggle" type="button" class="inline-flex items-center gap-1.5 rounded-full border border-slate-800 bg-slate-900/80 px-4 py-1.5 text-sm text-slate-300 transition-colors hover:border-slate-700 hover:text-white">
                    <svg id="history-toggle-icon" class="h-3.5 w-3.5 rotate-180 transition-transform duration-200" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
                    </svg>
                    <span id="history-toggle-label">Hide version history</span>
                </button>
            </div>

            <div id="history-panel" class="mt-4 grid grid-rows-[1fr] opacity-100 transition-[grid-template-rows,opacity] duration-300 ease-in-out">
                <div class="overflow-hidden">
                    <div class="rounded-2xl border border-slate-800 bg-slate-900/80 p-6 shadow-xl backdrop-blur">
                        <p class="mb-4 text-sm uppercase tracking-wider text-slate-400">Version History</p>
                        <ul id="history-list" class="divide-y divide-slate-800">
                            <li class="py-3 text-sm text-slate-500">Loading…</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
    <script>
        const API_URL = "https://api.github.com/repos/themeum/kirki-ecommerce/releases";
        const POLL_INTERVAL = 60_000;

        const totalCountEl = document.getElementById("total-count");
        const latestCountEl = document.getElementById("latest-count");
        const latestTagEl = document.getElementById("latest-tag");
        const latestNameEl = document.getElementById("latest-name");
        const latestDateEl = document.getElementById("latest-date");
        const lastUpdatedEl = document.getElementById("last-updated");
        const errorBannerEl = document.getElementById("error-banner");
        const totalCardEl = document.getElementById("total-card");
        const latestCardEl = document.getElementById("latest-card");
        const historyToggleEl = document.getElementById("history-toggle");
        const historyToggleIconEl = document.getElementById("history-toggle-icon");
        const historyToggleLabelEl = document.getElementById("history-toggle-label");
        const historyPanelEl = document.getElementById("history-panel");
        const historyListEl = document.getElementById("history-list");
        const distributionChartCanvas = document.getElementById("distribution-chart");
        const distributionLegendEl = document.getElementById("distribution-legend");

        let isHistoryVisible = true;
        let distributionChart = null;
        let currentSliceColors = [];
        let currentChannels = [];
        let distributionTotal = 0;

        const CHANNEL_DEFS = [
            { key: "alpha", label: "Alpha", test: /alpha/i, color: { base: "#8b5cf6", light: "#c4b5fd" } },
            { key: "beta", label: "Beta", test: /beta/i, color: { base: "#3b82f6", light: "#93c5fd" } },
            { key: "rc", label: "Release Candidate", test: /(^|[^a-z])rc([^a-z]|\d|$)/i, color: { base: "#f59e0b", light: "#fcd34d" } },
        ];
        const STABLE_CHANNEL = { key: "stable", label: "Stable", color: { base: "#10b981", light: "#6ee7b7" } };

        const getChannel = (release) => {
            const text = `${release.tag_name || ""} ${release.name || ""}`;
            return CHANNEL_DEFS.find((def) => def.test.test(text)) || STABLE_CHANNEL;
        };

        const sliceGradientScriptable = (context) => {
            const { chart, dataIndex } = context;
            const { ctx, chartArea } = chart;
            const { base, light } = currentSliceColors[dataIndex] || STABLE_CHANNEL.color;

            if (!chartArea) return base;

            const centerX = (chartArea.left + chartArea.right) / 2;
            const centerY = (chartArea.top + chartArea.bottom) / 2;
            const radius = Math.min(chartArea.right - chartArea.left, chartArea.bottom - chartArea.top) / 2;

            const gradient = ctx.createRadialGradient(centerX, centerY, radius * 0.15, centerX, centerY, radius);
            gradient.addColorStop(0, light);
            gradient.addColorStop(1, base);
            return gradient;
        };

        const centerTextPlugin = {
            id: "centerText",
            afterDraw(chart) {
                const { ctx, chartArea } = chart;
                const total = (chart.data.datasets[0]?.data ?? []).reduce((sum, value) => sum + value, 0);
                const centerX = (chartArea.left + chartArea.right) / 2;
                const centerY = (chartArea.top + chartArea.bottom) / 2;

                ctx.save();
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillStyle = "#94a3b8";
                ctx.font = "600 11px ui-sans-serif, system-ui, sans-serif";
                ctx.fillText("TOTAL", centerX, centerY - 14);
                ctx.fillStyle = "#f8fafc";
                ctx.font = "700 22px ui-sans-serif, system-ui, sans-serif";
                ctx.fillText(formatNumber(total), centerX, centerY + 8);
                ctx.restore();
            },
        };

        const sliceLabelsPlugin = {
            id: "sliceLabels",
            afterDraw(chart) {
                if (chart.data.labels.length === 1 && chart.data.labels[0] === "No data") return;

                const meta = chart.getDatasetMeta(0);
                const values = chart.data.datasets[0]?.data ?? [];
                const total = values.reduce((sum, value) => sum + value, 0);

                if (!meta || !total) return;

                const { ctx } = chart;
                ctx.save();
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.font = "700 12px ui-sans-serif, system-ui, sans-serif";
                ctx.fillStyle = "#f8fafc";
                ctx.shadowColor = "rgba(2, 6, 23, 0.85)";
                ctx.shadowBlur = 4;

                meta.data.forEach((arc, index) => {
                    const value = values[index];
                    const percent = (value / total) * 100;

                    if (percent < 5) return;

                    const midAngle = (arc.startAngle + arc.endAngle) / 2;
                    const radius = (arc.innerRadius + arc.outerRadius) / 2;
                    const x = arc.x + Math.cos(midAngle) * radius;
                    const y = arc.y + Math.sin(midAngle) * radius;

                    ctx.fillText(`${percent.toFixed(1)}%`, x, y);
                });

                ctx.restore();
            },
        };

        let lastUpdatedAt = null;
        let currentTotal = 0;
        let currentLatest = 0;
        let isFirstLoad = true;

        const sumAssetDownloads = (release) =>
            (release.assets ?? []).reduce((sum, asset) => sum + asset.download_count, 0);

        const formatDate = (iso) => {
            if (!iso) return "—";
            return new Date(iso).toLocaleDateString("en-US", {
                year: "numeric",
                month: "short",
                day: "numeric",
            });
        };

        const formatNumber = (value) =>
            Math.round(value).toLocaleString("en-US");

        const animateCount = (element, from, to, duration = 800) => {
            if (from === to) {
                element.textContent = formatNumber(to);
                return;
            }

            const start = performance.now();

            const step = (now) => {
                const elapsed = now - start;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                const current = from + (to - from) * eased;

                element.textContent = formatNumber(current);

                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    element.textContent = formatNumber(to);
                }
            };

            requestAnimationFrame(step);
        };

        const renderHistory = (releases) => {
            historyListEl.innerHTML = "";

            if (!releases.length) {
                const li = document.createElement("li");
                li.className = "py-3 text-sm text-slate-500";
                li.textContent = "No releases yet";
                historyListEl.appendChild(li);
                return;
            }

            const counts = releases.map(sumAssetDownloads);
            const maxCount = Math.max(...counts);

            releases.forEach((release, index) => {
                const releaseCount = counts[index];
                const isTop = releaseCount === maxCount && maxCount > 0;

                const li = document.createElement("li");
                li.className = isTop
                    ? "flex items-center justify-between gap-4 rounded-lg border border-amber-400/30 bg-amber-400/5 px-3 py-3 -mx-3"
                    : "flex items-center justify-between gap-4 py-3";

                const info = document.createElement("div");
                info.className = "min-w-0";

                const nameRow = document.createElement("div");
                nameRow.className = "flex items-center gap-2";

                const name = document.createElement("p");
                name.className = isTop
                    ? "truncate text-sm font-medium text-amber-200"
                    : "truncate text-sm text-slate-300";
                name.textContent = release.name || release.tag_name;
                nameRow.appendChild(name);

                if (isTop) {
                    const badge = document.createElement("span");
                    badge.className = "inline-flex shrink-0 items-center gap-1 rounded-full bg-amber-400/15 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-amber-300";
                    badge.textContent = "★ Top";
                    nameRow.appendChild(badge);
                }

                const date = document.createElement("p");
                date.className = "text-xs text-slate-500";
                date.textContent = formatDate(release.published_at);

                info.appendChild(nameRow);
                info.appendChild(date);

                const count = document.createElement("span");
                count.className = isTop
                    ? "shrink-0 font-mono text-sm font-bold tabular-nums text-amber-300"
                    : "shrink-0 font-mono text-sm tabular-nums text-slate-200";
                count.textContent = formatNumber(releaseCount);

                li.appendChild(info);
                li.appendChild(count);
                historyListEl.appendChild(li);
            });
        };

        const renderDistribution = (releases) => {
            const counts = releases.map(sumAssetDownloads);
            const total = counts.reduce((sum, value) => sum + value, 0);
            const hasData = releases.length > 0 && total > 0;
            distributionTotal = total;

            const channelOrder = [];
            const channelMap = new Map();

            releases.forEach((release, index) => {
                const channel = getChannel(release);
                if (!channelMap.has(channel.key)) {
                    channelMap.set(channel.key, {
                        label: channel.label,
                        color: channel.color,
                        releaseCount: 0,
                        downloads: 0,
                    });
                    channelOrder.push(channel.key);
                }
                const entry = channelMap.get(channel.key);
                entry.releaseCount += 1;
                entry.downloads += counts[index];
            });

            const channels = channelOrder
                .map((key) => channelMap.get(key))
                .sort((a, b) => b.downloads - a.downloads);

            currentChannels = channels;
            currentSliceColors = hasData ? channels.map((channel) => channel.color) : [STABLE_CHANNEL.color];

            distributionLegendEl.innerHTML = "";

            if (!hasData) {
                const li = document.createElement("li");
                li.className = "text-sm text-slate-500";
                li.textContent = "No download data yet";
                distributionLegendEl.appendChild(li);
            } else {
                channels.forEach((channel) => {
                    const percent = ((channel.downloads / total) * 100).toFixed(1);
                    const releaseWord = channel.releaseCount === 1 ? "release" : "releases";

                    const li = document.createElement("li");
                    li.className = "flex items-center justify-between gap-3 text-sm";

                    const left = document.createElement("span");
                    left.className = "flex min-w-0 items-center gap-2 text-slate-300";

                    const swatch = document.createElement("span");
                    swatch.className = "h-2.5 w-2.5 shrink-0 rounded-full";
                    swatch.style.backgroundColor = channel.color.base;

                    const label = document.createElement("span");
                    label.className = "truncate";
                    label.textContent = `${channel.label} · ${channel.releaseCount} ${releaseWord}`;

                    left.appendChild(swatch);
                    left.appendChild(label);

                    const right = document.createElement("span");
                    right.className = "shrink-0 font-mono tabular-nums text-slate-400";
                    right.textContent = `${formatNumber(channel.downloads)} · ${percent}%`;

                    li.appendChild(left);
                    li.appendChild(right);
                    distributionLegendEl.appendChild(li);
                });

                const maxCount = Math.max(...counts);
                const topIndex = counts.indexOf(maxCount);
                const topRelease = releases[topIndex];

                const topLi = document.createElement("li");
                topLi.className = "mt-1 flex items-center justify-between gap-3 border-t border-slate-800 pt-3 text-sm";

                const topLeft = document.createElement("span");
                topLeft.className = "flex min-w-0 items-center gap-2 text-amber-300";

                const topIcon = document.createElement("span");
                topIcon.textContent = "★";

                const topLabel = document.createElement("span");
                topLabel.className = "truncate";
                topLabel.textContent = `Top: ${topRelease.name || topRelease.tag_name}`;

                topLeft.appendChild(topIcon);
                topLeft.appendChild(topLabel);

                const topRight = document.createElement("span");
                topRight.className = "shrink-0 font-mono tabular-nums text-amber-300";
                topRight.textContent = formatNumber(maxCount);

                topLi.appendChild(topLeft);
                topLi.appendChild(topRight);
                distributionLegendEl.appendChild(topLi);

                const releaseCountLi = document.createElement("li");
                releaseCountLi.className = "flex items-center justify-between gap-3 text-sm text-slate-400";
                releaseCountLi.innerHTML = `<span>Total releases</span><span class="font-mono tabular-nums">${releases.length}</span>`;
                distributionLegendEl.appendChild(releaseCountLi);
            }

            const chartData = hasData ? channels.map((channel) => channel.downloads) : [1];
            const chartLabels = hasData ? channels.map((channel) => channel.label) : ["No data"];
            const backgroundColors = hasData ? sliceGradientScriptable : ["#1e293b"];

            if (!distributionChart) {
                distributionChart = new Chart(distributionChartCanvas, {
                    type: "doughnut",
                    data: {
                        labels: chartLabels,
                        datasets: [{
                            data: chartData,
                            backgroundColor: backgroundColors,
                            borderColor: "#020617",
                            borderWidth: 2,
                            hoverOffset: 8,
                        }],
                    },
                    options: {
                        cutout: "68%",
                        animation: { duration: 600, easing: "easeOutQuart" },
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                enabled: hasData,
                                backgroundColor: "#0f172a",
                                borderColor: "#1e293b",
                                borderWidth: 1,
                                titleColor: "#f8fafc",
                                bodyColor: "#cbd5e1",
                                padding: 10,
                                callbacks: {
                                    label: (context) => {
                                        const value = context.parsed;
                                        const pct = distributionTotal ? ((value / distributionTotal) * 100).toFixed(1) : "0.0";
                                        const channel = currentChannels[context.dataIndex];
                                        if (!channel) return ` ${formatNumber(value)} downloads`;
                                        const releaseWord = channel.releaseCount === 1 ? "release" : "releases";
                                        return ` ${formatNumber(value)} downloads (${pct}%) · ${channel.releaseCount} ${releaseWord}`;
                                    },
                                },
                            },
                        },
                    },
                    plugins: [centerTextPlugin, sliceLabelsPlugin],
                });
            } else {
                distributionChart.data.labels = chartLabels;
                distributionChart.data.datasets[0].data = chartData;
                distributionChart.data.datasets[0].backgroundColor = backgroundColors;
                distributionChart.options.plugins.tooltip.enabled = hasData;
                distributionChart.update();
            }
        };

        const setHistoryVisible = (visible) => {
            isHistoryVisible = visible;
            historyPanelEl.classList.toggle("grid-rows-[0fr]", !visible);
            historyPanelEl.classList.toggle("grid-rows-[1fr]", visible);
            historyPanelEl.classList.toggle("opacity-0", !visible);
            historyToggleLabelEl.textContent = visible ? "Hide version history" : "Show version history";
            historyToggleIconEl.classList.toggle("rotate-180", visible);
            historyToggleEl.setAttribute("aria-expanded", String(visible));
        };

        const setErrorState = (hasError) => {
            errorBannerEl.classList.toggle("hidden", !hasError);
            totalCardEl.classList.toggle("border-red-500/30", hasError);
            latestCardEl.classList.toggle("border-red-500/30", hasError);
        };

        const updateRelativeTime = () => {
            if (!lastUpdatedAt) {
                lastUpdatedEl.textContent = "Connecting…";
                return;
            }

            const seconds = Math.floor((Date.now() - lastUpdatedAt) / 1000);

            if (seconds < 5) {
                lastUpdatedEl.textContent = "Updated just now";
                return;
            }

            if (seconds < 60) {
                lastUpdatedEl.textContent = `Updated ${seconds}s ago`;
                return;
            }

            const minutes = Math.floor(seconds / 60);
            lastUpdatedEl.textContent = `Updated ${minutes}m ago`;
        };

        const fetchAndRender = async () => {
            try {
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const releases = await response.json();

                if (!Array.isArray(releases)) {
                    throw new Error("Invalid response");
                }

                const totalDownloads = releases.reduce(
                    (sum, release) => sum + sumAssetDownloads(release),
                    0
                );

                const latestRelease = releases[0];
                const latestDownloads = latestRelease ? sumAssetDownloads(latestRelease) : 0;

                const totalFrom = isFirstLoad ? 0 : currentTotal;
                const latestFrom = isFirstLoad ? 0 : currentLatest;

                animateCount(totalCountEl, totalFrom, totalDownloads);
                animateCount(latestCountEl, latestFrom, latestDownloads);

                currentTotal = totalDownloads;
                currentLatest = latestDownloads;
                isFirstLoad = false;

                if (latestRelease) {
                    latestTagEl.textContent = latestRelease.tag_name;
                    latestNameEl.textContent = latestRelease.name || latestRelease.tag_name;
                    latestDateEl.textContent = formatDate(latestRelease.published_at);
                } else {
                    latestTagEl.textContent = "No releases";
                    latestNameEl.textContent = "No releases yet";
                    latestDateEl.textContent = "—";
                }

                renderHistory(releases);
                renderDistribution(releases);

                lastUpdatedAt = Date.now();
                updateRelativeTime();
                setErrorState(false);
            } catch {
                setErrorState(true);

                if (isFirstLoad) {
                    totalCountEl.textContent = "—";
                    latestCountEl.textContent = "—";
                }
            }
        };

        historyToggleEl.addEventListener("click", () => {
            setHistoryVisible(!isHistoryVisible);
        });

        window.addEventListener("DOMContentLoaded", () => {
            setHistoryVisible(true);
            fetchAndRender();
            setInterval(fetchAndRender, POLL_INTERVAL);
            setInterval(updateRelativeTime, 1000);
        });
    </script>
</body>
</html>
